name: Research source updates

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    # Disabled until the repository owner sets this repository variable to true.
    if: ${{ vars.PS5_RESEARCH_UPDATES_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      PYTHONPATH: src
      PS5_RESEARCH_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: research/sony-source-validation-2026-10-20
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Poll approved public source list
        run: python -S -m ps5knowledge update-sources --enable
      - name: Rebuild local database and dashboard
        run: |
          python -S -m ps5knowledge build-db
          python -S -m ps5knowledge dashboard
      - name: Propose source metadata changes for review
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ github.token }}
          base: research/sony-source-validation-2026-10-20
          branch: automation/research-source-updates
          delete-branch: false
          draft: true
          add-paths: |
            research/knowledge-base/updates.json
            research/knowledge-base/update-report.md
          commit-message: 'research: record upstream source activity'
          title: 'Automated research source activity update'
          body: |
            This draft contains incremental GitHub source-activity observations. It does not promote claims or compatibility status. Review pinned commits, releases, issues, pull requests and any discovery candidates before editing the knowledge catalog.
      - name: Keep report and dashboard as run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-update-report
          path: |
            research/knowledge-base/update-report.md
            research/knowledge-base/dashboard.html
          if-no-files-found: error
          retention-days: 14

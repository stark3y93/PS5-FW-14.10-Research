[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5fwlab"
version = "0.1.0"
description = "Read-only SLB2 metadata inspection and bounded byte statistics"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
ps5fwlab = "ps5fwlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
